# Sertantai Enforcement - Development Docker Compose
#
# This is for LOCAL DEVELOPMENT ONLY. Production uses infrastructure/docker/docker-compose.yml
#
# Usage modes:
#
# Mode 1: Core services (postgres + electric)
#   docker compose -f docker-compose.dev.yml up -d postgres electric
#   Run Phoenix on host for fast development with hot reload
#
# Mode 2: With Redis
#   docker compose -f docker-compose.dev.yml up -d postgres electric redis
#
# Mode 3: Full stack (all services including containerized app)
#   docker compose -f docker-compose.dev.yml up --build app
#   Test production Docker builds locally before pushing to GHCR
#
# Mode 4: Integration testing (includes Baserow)
#   docker compose -f docker-compose.dev.yml --profile integration up -d

services:
  # PostgreSQL with logical replication for ElectricSQL
  postgres:
    image: postgres:16
    container_name: sertantai_enforcement_postgres
    ports:
      - "5434:5432" # Use 5434 to avoid conflict with other local postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sertantai_enforcement_dev
    volumes:
      - sertantai_enforcement_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sertantai_enforcement_network
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_connections=200"

  # ElectricSQL sync service (v1.0 - HTTP Shape API for local-first sync)
  electric:
    image: electricsql/electric:latest
    container_name: sertantai_enforcement_electric
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sertantai_enforcement_dev
      HTTP_PORT: 3000
      ELECTRIC_INSECURE: "true" # Development only!
      PG_PROXY_PASSWORD: proxy_password
    ports:
      - "3001:3000" # HTTP API for Shape-based sync
    networks:
      - sertantai_enforcement_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:3000/v1/shape?table=_electric_metadata&offset=-1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis (optional - for caching/sessions)
  redis:
    image: redis:7-alpine
    container_name: sertantai_enforcement_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - sertantai_enforcement_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sertantai_enforcement_network
    restart: unless-stopped

  # Phoenix app (for testing Docker builds before production)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/shotleybuilder/sertantai-enforcement:latest
    container_name: sertantai_enforcement_app
    ports:
      - "4002:4002"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sertantai_enforcement_dev
      PHX_HOST: localhost
      PHX_SERVER: "true"
      PORT: "4002"
      POOL_SIZE: "10"
      ELECTRIC_URL: http://electric:3000
      FRONTEND_URL: http://localhost:5173
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-dev_secret_key_base_at_least_64_chars_long_for_phoenix_security}
      TOKEN_SIGNING_SECRET: ${TOKEN_SIGNING_SECRET:-dev_token_secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:4002/auth/user/github/callback}
      ERL_MAX_PORTS: "1024"
      ERL_MAX_ETS_TABLES: "64"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sertantai_enforcement_network
    restart: unless-stopped

  # Optional: Local Baserow for integration testing
  baserow:
    profiles: ["integration"]
    image: baserow/baserow:latest
    container_name: sertantai_enforcement_baserow
    shm_size: "1gb"
    ports:
      - "8080:80"
    environment:
      BASEROW_PUBLIC_URL: http://localhost:8080
      DATABASE_HOST: postgres
      DATABASE_NAME: baserow_dev
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev_baserow_secret_key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sertantai_enforcement_network
    restart: unless-stopped

volumes:
  sertantai_enforcement_postgres_data:
    driver: local
  sertantai_enforcement_redis_data:
    driver: local

networks:
  sertantai_enforcement_network:
    driver: bridge
    name: sertantai_enforcement_network
